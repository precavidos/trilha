spring:
  application:
    name: trilha-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trilha}
    username: ${DB_USER:trilha}
    password: ${DB_PASSWORD:trilha}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Provedor de LLM trocado por configuração (ADR 0005).
trilha:
  llm:
    provider: ${LLM_PROVIDER:gemini}        # gemini | ollama
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
