spring:
  application:
    name: trilha-backend
  # Lê GEMINI_API_KEY etc. do .env na raiz do repositório, se existir.
  config:
    import: optional:file:../.env[.properties]
  # Histórico do SIGAA (módulo discente): lido em memória e nunca gravado (ADR 0003).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

trilha:
  dados:
    analise: ${TRILHA_ANALISE:../data/analise/analise-smd-2024-2.json}
    estruturas: ${TRILHA_ESTRUTURAS:../data/seed/estruturas}
    itinerarios: ${TRILHA_ITINERARIOS:../data/seed/itinerarios-smd.json}
  # Classificação de cobertura (ADR 0010). "escore" = (similaridade − média) / desvio da competência.
  # Calibrados por inspeção da distribuição; a validação com rótulos humanos mede a precisão.
  limiares:
    coberta-similaridade: 0.89
    coberta-escore: 2.8
    parcial-similaridade: 0.88
    parcial-escore: 2.4
  # Provedor de LLM trocado por configuração (ADR 0005).
  llm:
    provider: ${LLM_PROVIDER:gemini}        # gemini | ollama
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:3b}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
