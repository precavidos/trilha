services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: trilha
      POSTGRES_USER: trilha
      POSTGRES_PASSWORD: trilha
    ports:
      - "5432:5432"
    volumes:
      - trilha-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trilha -d trilha"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trilha-db:
